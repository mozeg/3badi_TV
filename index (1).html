<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبادي TV - منصة البث السينمائي الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --primary: #00FFFF;
            --primary-hover: #00cccc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
        
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: var(--transition); cursor: pointer; font-size: 15px; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,255,255,0.4); }
        
        .search-box {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 30px; padding: 5px 15px;
        }
        .search-box input { background: transparent; border: none; color: var(--text-main); outline: none; padding: 5px; font-size: 14px; width: 180px; }
        .search-box button { background: transparent; border: none; color: var(--primary); cursor: pointer; }

        .container { max-width: 1400px; margin: 110px auto 50px; padding: 0 20px; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-right: 4px solid var(--primary); padding-right: 10px; }
        
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .media-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: var(--transition); cursor: pointer; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .media-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0, 255, 255, 0.2); }
        .media-poster { width: 100%; height: 300px; object-fit: cover; background: #222; }
        .media-info { padding: 12px; }
        .media-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .media-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
        .media-rating { color: #f5c518; font-weight: 700; }

        /* Modal Player & Controls */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #12161f; width: 100%; max-width: 950px; border-radius: 16px; overflow: hidden; max-height: 92vh; display: flex; flex-direction: column; border: 1px solid rgba(0, 255, 255, 0.3); position: relative; }
        .close-modal { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); border: none; color: #fff; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .close-modal:hover { background: var(--primary); color: #000; }
        
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        .player-container iframe { width: 100%; height: 100%; border: none; }
        
        .server-switcher { display: flex; gap: 10px; padding: 10px 20px; background: #0f131a; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .server-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: var(--transition); }
        .server-btn.active { background: var(--primary); color: #0b0e14; border-color: var(--primary); }

        .episode-selector { display: none; gap: 10px; padding: 10px 20px; background: #0f131a; }
        .episode-selector select { background: var(--card-bg); color: #fff; border: 1px solid rgba(0, 255, 255, 0.3); padding: 8px 12px; border-radius: 6px; outline: none; }

        .modal-body { padding: 20px; overflow-y: auto; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
        .modal-info-text { flex: 1; }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: var(--primary); }
        .modal-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        
        .watchlist-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: var(--transition); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .watchlist-btn:hover, .watchlist-btn.added { background: var(--primary); color: #0b0e14; }

        .loader-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 350px; grid-column: 1 / -1; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error-box { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-muted); }
        .error-box button { margin-top: 15px; background: var(--primary); color: #0b0e14; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        @media(max-width: 768px) {
            .nav-links { display: none; }
            .modal-body { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="switchTab('trending', this)"><i class="fa-solid fa-play-circle"></i> عبادي TV</a>
        <ul class="nav-links">
            <li><a class="active" onclick="switchTab('trending', this)">الرئيسية</a></li>
            <li><a onclick="switchTab('movie', this)">الأفلام</a></li>
            <li><a onclick="switchTab('tv', this)">المسلسلات</a></li>
            <li><a onclick="switchTab('watchlist', this)">المفضلة</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionHeader" class="section-title"><i class="fa-solid fa-fire"></i> العروض الرائجة عالمياً</h2>
        <div id="mediaGrid" class="media-grid">
            <div class="loader-container"><div class="spinner"></div><p>جاري تحميل المحتوى السينمائي...</p></div>
        </div>
    </div>

    <!-- نافذة العرض والتشغيل المتطورة -->
    <div id="mediaModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="player-container"><iframe id="videoPlayer" src="" allowfullscreen></iframe></div>
            
            <!-- مبدل السيرفرات لضمان عدم توقف المشاهدة -->
            <div class="server-switcher">
                <span style="font-size: 13px; color: var(--text-muted);">سيرفرات المشاهدة:</span>
                <button class="server-btn active" id="server1Btn" onclick="changeServer(1)">سيرفر 1 (الرئيسي)</button>
                <button class="server-btn" id="server2Btn" onclick="changeServer(2)">سيرفر 2 (بديل)</button>
            </div>

            <div class="episode-selector" id="episodesControl">
                <select id="seasonSelect" onchange="updateEpisodesList()"><option value="1">الموسم 1</option></select>
                <select id="episodeSelect" onchange="changeEpisode()"><option value="1">الحلقة 1</option></select>
            </div>

            <div class="modal-body">
                <div class="modal-info-text">
                    <h3 id="modalTitle" class="modal-title"></h3>
                    <p id="modalDesc" class="modal-desc"></p>
                </div>
                <button id="watchlistActionBtn" class="watchlist-btn" onclick="toggleWatchlistModalItem()">
                    <i class="fa-solid fa-bookmark"></i> أضف للمفضلة
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ مهم جداً: هذا المفتاح كان مفتاحاً تجريبياً/مشتركاً وقد تم إيقافه من قبل TMDB.
        // يجب استبداله بمفتاح API خاص بك (مجاني) من الرابط التالي:
        // https://www.themoviedb.org/settings/api
        // بعد التسجيل، انسخ "API Key (v3 auth)" وضعه هنا بدلاً من القيمة الحالية.
        const API_KEY = 'c1532aa2e726cf64009b81018359068c';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        let currentMediaType = 'trending';
        let currentId = null, currentType = 'movie', currentTitle = '', currentDesc = '', currentPoster = '', currentRating = '', currentYear = '';
        let currentActiveServer = 1;
        let currentSeason = 1, currentEpisode = 1;

        window.addEventListener('DOMContentLoaded', () => { fetchMedia('trending/all/day'); });

        async function fetchMedia(endpoint, query = '') {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '<div class="loader-container"><div class="spinner"></div><p>جاري الاتصال بقاعدة البيانات...</p></div>';
            
            let url = query ? `${BASE_URL}/search/multi?api_key=${API_KEY}&language=ar-AR&query=${encodeURIComponent(query)}` :
                      endpoint.startsWith('trending') ? `${BASE_URL}/${endpoint}?api_key=${API_KEY}&language=ar-AR` :
                      `${BASE_URL}/discover/${endpoint}?api_key=${API_KEY}&language=ar-AR&sort_by=popularity.desc`;

            try {
                const response = await fetch(url);
                const data = await response.json().catch(() => null);

                if (!response.ok) {
                    // نعرض رسالة الخطأ الحقيقية القادمة من TMDB بدل رسالة عامة غير دقيقة
                    const code = data && data.status_code;
                    const msg = data && data.status_message;
                    let reason = msg || `HTTP ${response.status}`;
                    let hint = '';
                    if (response.status === 401 || code === 7 || code === 16) {
                        hint = 'مفتاح API غير صالح أو تم إيقافه. افتح ملف الكود واستبدل قيمة API_KEY بمفتاح خاص بك من themoviedb.org (راجع التعليق أعلى تعريف API_KEY في الكود).';
                    } else if (response.status === 429) {
                        hint = 'تم تجاوز الحد المسموح من الطلبات على هذا المفتاح (Rate Limit). انتظر قليلاً أو استخدم مفتاح API خاص بك.';
                    }
                    throw new Error(`${reason}${hint ? ' — ' + hint : ''}`);
                }

                // إذا كانت النتائج فارغة بالعربية، نحاول جلبها باللغة الافتراضية
                if ((!data || !data.results || data.results.length === 0) && query) {
                    const fallbackUrl = `${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                    const res2 = await fetch(fallbackUrl);
                    const data2 = await res2.json().catch(() => null);
                    displayMedia((data2 && data2.results) || []);
                } else {
                    displayMedia((data && data.results) || []);
                }
            } catch (error) {
                // نفرّق بين خطأ شبكة حقيقي (CORS/اتصال) وبين خطأ راجع من TMDB نفسه
                const isNetworkError = error instanceof TypeError;
                const message = isNetworkError
                    ? 'تعذر الوصول إلى api.themoviedb.org. تحقق من اتصال الإنترنت، أو أن الموقع/الشبكة الحالية لا تحجب هذا النطاق، أو جرّب تعطيل أي إضافة حجب إعلانات.'
                    : error.message;

                grid.innerHTML = `
                    <div class="error-box">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"></i>
                        <p style="max-width:520px;margin:0 auto;">${message}</p>
                        <button onclick="fetchMedia('${endpoint}', '${query}')"><i class="fa-solid fa-rotate-right"></i> إعادة المحاولة</button>
                    </div>`;
                console.error('TMDB fetch error:', error);
            }
        }

        function displayMedia(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            const filtered = items.filter(i => i.poster_path);
            
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted); padding: 30px;">لا توجد نتائج مطابقة لبحثك.</p>';
                return;
            }

            filtered.forEach(item => {
                const title = item.title || item.name || 'بدون عنوان';
                const date = (item.release_date || item.first_air_date || '2026').split('-')[0];
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const type = item.media_type || (currentMediaType === 'movie' ? 'movie' : currentMediaType === 'tv' ? 'tv' : 'movie');

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openModal({ id: item.id, type, title, desc: item.overview, poster: item.poster_path, rating, year: date });
                card.innerHTML = `
                    <img class="media-poster" src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}" loading="lazy">
                    <div class="media-info">
                        <div class="media-title" title="${title}">${title}</div>
                        <div class="media-meta">
                            <span>${date}</span>
                            <span class="media-rating"><i class="fa-solid fa-star"></i> ${rating}</span>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function switchTab(type, element) {
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentMediaType = type;
            const header = document.getElementById('sectionHeader');
            
            if (type === 'trending') { header.innerHTML = '<i class="fa-solid fa-fire"></i> العروض الرائجة عالمياً'; fetchMedia('trending/all/day'); }
            else if (type === 'movie') { header.innerHTML = '<i class="fa-solid fa-clapperboard"></i> أحدث الأفلام العالمية'; fetchMedia('movie'); }
            else if (type === 'tv') { header.innerHTML = '<i class="fa-solid fa-tv"></i> أحدث المسلسلات التلفزيونية'; fetchMedia('tv'); }
            else if (type === 'watchlist') { header.innerHTML = '<i class="fa-solid fa-bookmark"></i> قائمة المفضلة المحفوظة'; displayWatchlist(); }
        }

        // نظام المفضلة المحلي (LocalStorage)
        function getWatchlist() { return JSON.parse(localStorage.getItem('abadi_watchlist') || '[]'); }
        
        function displayWatchlist() {
            const list = getWatchlist();
            displayMedia(list);
        }

        function toggleWatchlistModalItem() {
            let list = getWatchlist();
            const index = list.findIndex(i => i.id === currentId);
            const btn = document.getElementById('watchlistActionBtn');
            
            if (index > -1) {
                list.splice(index, 1);
                btn.classList.remove('added');
                btn.innerHTML = '<i class="fa-solid fa-bookmark"></i> أضف للمفضلة';
            } else {
                list.push({ id: currentId, media_type: currentType, title: currentTitle, overview: currentDesc, poster_path: currentPoster, vote_average: parseFloat(currentRating), release_date: currentYear });
                btn.classList.add('added');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تمت الإزالة';
            }
            localStorage.setItem('abadi_watchlist', JSON.stringify(list));
        }

        // نظام البحث الفوري
        const searchInput = document.getElementById('searchInput');
        let timeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const q = e.target.value.trim();
            if (q) {
                timeout = setTimeout(() => {
                    document.getElementById('sectionHeader').innerHTML = `<i class="fa-solid fa-search"></i> نتائج البحث عن: "${q}"`;
                    fetchMedia('', q);
                }, 400);
            } else { fetchMedia('trending/all/day'); }
        });

        // بيانات المواسم الحقيقية للمسلسل المفتوح حالياً (season_number -> episode_count)
        let currentSeasonsData = [];

        // فتح مشغل الفيديو مع دعم سيرفرات متعددة
        async function openModal(media) {
            currentId = media.id;
            currentType = media.type;
            currentTitle = media.title;
            currentDesc = media.desc;
            currentPoster = media.poster;
            currentRating = media.rating;
            currentYear = media.year;

            const modal = document.getElementById('mediaModal');
            document.getElementById('modalTitle').textContent = currentTitle;
            document.getElementById('modalDesc').textContent = currentDesc || 'لا توجد قصة متوفرة لهذا العمل.';
            
            // تحقق حالة المفضلة
            const list = getWatchlist();
            const btn = document.getElementById('watchlistActionBtn');
            if (list.some(i => i.id === currentId)) {
                btn.classList.add('added');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> في المفضلة';
            } else {
                btn.classList.remove('added');
                btn.innerHTML = '<i class="fa-solid fa-bookmark"></i> أضف للمفضلة';
            }

            const episodesControl = document.getElementById('episodesControl');
            if (currentType === 'tv') {
                episodesControl.style.display = 'flex';
                modal.style.display = 'flex';
                await loadRealSeasonsAndEpisodes(currentId);
            } else {
                episodesControl.style.display = 'none';
                modal.style.display = 'flex';
                loadPlayerUrl();
            }
        }

        // يجلب من TMDB العدد الحقيقي للمواسم وعدد حلقات كل موسم لهذا المسلسل بالذات
        async function loadRealSeasonsAndEpisodes(tvId) {
            const sSelect = document.getElementById('seasonSelect');
            const eSelect = document.getElementById('episodeSelect');
            sSelect.innerHTML = '<option>...جاري التحميل</option>';
            eSelect.innerHTML = '';

            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}?api_key=${API_KEY}&language=ar-AR`);
                if (!res.ok) throw new Error('تعذر جلب بيانات المواسم');
                const data = await res.json();

                // نستبعد الموسم 0 (الحلقات الخاصة) إن وُجدت مواسم حقيقية أخرى
                let seasons = (data.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0);
                if (seasons.length === 0) seasons = data.seasons || [{ season_number: 1, episode_count: 1, name: 'الموسم 1' }];

                currentSeasonsData = seasons;
                sSelect.innerHTML = seasons.map(s => `<option value="${s.season_number}">${s.name || ('الموسم ' + s.season_number)}</option>`).join('');
                updateEpisodesList();
            } catch (error) {
                console.error('TMDB seasons fetch error:', error);
                // نرجع لخيار افتراضي بدل تعطيل المشغل بالكامل
                currentSeasonsData = [{ season_number: 1, episode_count: 1, name: 'الموسم 1' }];
                sSelect.innerHTML = '<option value="1">الموسم 1</option>';
                updateEpisodesList();
            }
        }

        function loadPlayerUrl() {
            const player = document.getElementById('videoPlayer');
            let url = '';
            if (currentType === 'tv') {
                if (currentActiveServer === 1) {
                    url = `https://vidsrc.me/embed/tv?tmdb=${currentId}&season=${currentSeason}&episode=${currentEpisode}`;
                } else {
                    url = `https://vidsrc.cc/v2/embed/tv/${currentId}/${currentSeason}/${currentEpisode}`;
                }
            } else {
                if (currentActiveServer === 1) {
                    url = `https://vidsrc.me/embed/movie?tmdb=${currentId}`;
                } else {
                    url = `https://vidsrc.cc/v2/embed/movie/${currentId}`;
                }
            }
            player.src = url;
        }

        function changeServer(serverNum) {
            currentActiveServer = serverNum;
            document.getElementById('server1Btn').classList.toggle('active', serverNum === 1);
            document.getElementById('server2Btn').classList.toggle('active', serverNum === 2);
            loadPlayerUrl();
        }

        function updateEpisodesList() {
            const eSelect = document.getElementById('episodeSelect');
            const seasonNum = parseInt(document.getElementById('seasonSelect').value, 10);
            const seasonInfo = currentSeasonsData.find(s => s.season_number === seasonNum);
            const episodeCount = (seasonInfo && seasonInfo.episode_count) || 1;

            eSelect.innerHTML = '';
            for(let i=1; i<=episodeCount; i++) eSelect.innerHTML += `<option value="${i}">الحلقة ${i}</option>`;
            changeEpisode();
        }

        function changeEpisode() {
            currentSeason = document.getElementById('seasonSelect').value;
            currentEpisode = document.getElementById('episodeSelect').value;
            loadPlayerUrl();
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        window.onclick = (e) => { if (e.target === document.getElementById('mediaModal')) closeModal(); }
    </script>
</body>
</html>
