<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبادي TV - منصة البث السينمائي الشاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --primary: #00FFFF;
            --primary-hover: #00cccc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(11, 14, 20, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center; padding: 15px 5%;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: var(--transition); cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .search-box {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(0, 255, 255, 0.2); border-radius: 30px; padding: 5px 15px;
        }
        .search-box input { background: transparent; border: none; color: var(--text-main); outline: none; padding: 5px; font-size: 14px; width: 180px; }
        .search-box button { background: transparent; border: none; color: var(--primary); cursor: pointer; }
        .container { max-width: 1400px; margin: 100px auto 50px; padding: 0 20px; }
        .section-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-right: 4px solid var(--primary); padding-right: 10px; }
        .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .media-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; transition: var(--transition); cursor: pointer; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        .media-card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 10px 20px rgba(0, 255, 255, 0.15); }
        .media-poster { width: 100%; height: 300px; object-fit: cover; background: #222; }
        .media-info { padding: 12px; }
        .media-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
        .media-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }
        .media-rating { color: #f5c518; font-weight: 700; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #12161f; width: 100%; max-width: 900px; border-radius: 16px; overflow: hidden; max-height: 90vh; display: flex; flex-direction: column; border: 1px solid rgba(0, 255, 255, 0.2); position: relative; }
        .close-modal { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .close-modal:hover { background: var(--primary); color: #000; }
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        .player-container iframe { width: 100%; height: 100%; border: none; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: var(--primary); }
        .modal-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; }
        .episode-selector { display: none; gap: 10px; padding: 10px 20px; background: #0f131a; }
        .episode-selector select { background: var(--card-bg); color: #fff; border: 1px solid rgba(0, 255, 255, 0.3); padding: 8px 12px; border-radius: 6px; outline: none; }
        .loader { display: flex; justify-content: center; align-items: center; height: 300px; grid-column: 1 / -1; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo" onclick="switchTab('trending', this)"><i class="fa-solid fa-play-circle"></i> عبادي TV</a>
        <ul class="nav-links">
            <li><a class="active" onclick="switchTab('trending', this)">الرئيسية</a></li>
            <li><a onclick="switchTab('movie', this)">الأفلام</a></li>
            <li><a onclick="switchTab('tv', this)">المسلسلات</a></li>
            <li><a onclick="switchTab('watchlist', this)">المفضلة</a></li>
        </ul>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل...">
            <button><i class="fa-solid fa-search"></i></button>
        </div>
    </header>

    <div class="container">
        <h2 id="sectionHeader" class="section-title"><i class="fa-solid fa-fire"></i> العروض الرائجة عالمياً</h2>
        <div id="mediaGrid" class="media-grid">
            <div class="loader"><div class="spinner"></div></div>
        </div>
    </div>

    <div id="mediaModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="player-container"><iframe id="videoPlayer" src="" allowfullscreen></iframe></div>
            <div class="episode-selector" id="episodesControl">
                <select id="seasonSelect" onchange="updateEpisodesList()"><option value="1">الموسم 1</option></select>
                <select id="episodeSelect" onchange="changeEpisode()"><option value="1">الحلقة 1</option></select>
            </div>
            <div class="modal-body">
                <h3 id="modalTitle" class="modal-title"></h3>
                <p id="modalDesc" class="modal-desc"></p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'c8192660aa8a221f736024987ec96af5';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';
        const EMBED_MOVIE = 'https://vidsrc.me/embed/movie?tmdb=';
        const EMBED_TV = 'https://vidsrc.me/embed/tv?tmdb=';

        let currentMediaType = 'trending';
        let currentId = null;

        window.addEventListener('DOMContentLoaded', () => { fetchMedia('trending/all/day'); });

        async function fetchMedia(endpoint, query = '') {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
            let url = query ? `${BASE_URL}/search/multi?api_key=${API_KEY}&language=ar-AR&query=${encodeURIComponent(query)}` : 
                      endpoint === 'trending' ? `${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=ar-AR` : 
                      `${BASE_URL}/discover/${endpoint}?api_key=${API_KEY}&language=ar-AR&sort_by=popularity.desc`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                displayMedia(data.results || []);
            } catch (error) {
                grid.innerHTML = '<p style="text-align:center; color: var(--primary); grid-column: 1/-1;">تعذر جلب البيانات. تحقق من اتصال الإنترنت أو مانع الإعلانات.</p>';
            }
        }

        function displayMedia(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            const filtered = items.filter(i => i.poster_path);
            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">لا توجد نتائج مطابقة.</p>';
                return;
            }
            filtered.forEach(item => {
                const title = item.title || item.name || 'بدون عنوان';
                const date = (item.release_date || item.first_air_date || '2026').split('-')[0];
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const type = item.media_type || (currentMediaType === 'movie' ? 'movie' : currentMediaType === 'tv' ? 'tv' : 'movie');

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openModal(item.id, type, title, item.overview, item.number_of_seasons || 1);
                card.innerHTML = `
                    <img class="media-poster" src="${IMAGE_BASE_URL + item.poster_path}" alt="${title}" loading="lazy">
                    <div class="media-info">
                        <div class="media-title" title="${title}">${title}</div>
                        <div class="media-meta">
                            <span>${date}</span>
                            <span class="media-rating"><i class="fa-solid fa-star"></i> ${rating}</span>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function switchTab(type, element) {
            document.querySelectorAll('.nav-links a').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentMediaType = type;
            const header = document.getElementById('sectionHeader');
            if (type === 'trending') { header.innerHTML = '<i class="fa-solid fa-fire"></i> العروض الرائجة عالمياً'; fetchMedia('trending/all/day'); }
            else if (type === 'movie') { header.innerHTML = '<i class="fa-solid fa-clapperboard"></i> أحدث الأفلام العالمية'; fetchMedia('movie'); }
            else if (type === 'tv') { header.innerHTML = '<i class="fa-solid fa-tv"></i> أحدث المسلسلات التلفزيونية'; fetchMedia('tv'); }
            else if (type === 'watchlist') { header.innerHTML = '<i class="fa-solid fa-bookmark"></i> قائمة المفضلة'; displayWatchlist(); }
        }

        const searchInput = document.getElementById('searchInput');
        let timeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const q = e.target.value.trim();
            if (q) {
                timeout = setTimeout(() => {
                    document.getElementById('sectionHeader').innerHTML = `<i class="fa-solid fa-search"></i> نتائج البحث عن: "${q}"`;
                    fetchMedia('', q);
                }, 400);
            } else { fetchMedia('trending/all/day'); }
        });

        function openModal(id, type, title, desc, seasons = 1) {
            currentId = id;
            const modal = document.getElementById('mediaModal');
            const player = document.getElementById('videoPlayer');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalDesc').textContent = desc || 'لا توجد قصة متوفرة.';
            const episodesControl = document.getElementById('episodesControl');

            if (type === 'tv') {
                episodesControl.style.display = 'flex';
                const sSelect = document.getElementById('seasonSelect');
                sSelect.innerHTML = '';
                for(let i=1; i<=seasons; i++) sSelect.innerHTML += `<option value="${i}">الموسم ${i}</option>`;
                updateEpisodesList();
                player.src = `${EMBED_TV}${id}&season=1&episode=1`;
            } else {
                episodesControl.style.display = 'none';
                player.src = `${EMBED_MOVIE}${id}`;
            }
            modal.style.display = 'flex';
        }

        function updateEpisodesList() {
            const eSelect = document.getElementById('episodeSelect');
            eSelect.innerHTML = '';
            for(let i=1; i<=25; i++) eSelect.innerHTML += `<option value="${i}">الحلقة ${i}</option>`;
            changeEpisode();
        }

        function changeEpisode() {
            const s = document.getElementById('seasonSelect').value;
            const ep = document.getElementById('episodeSelect').value;
            document.getElementById('videoPlayer').src = `${EMBED_TV}${currentId}&season=${s}&episode=${ep}`;
        }

        function closeModal() {
            document.getElementById('mediaModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        window.onclick = (e) => { if (e.target === document.getElementById('mediaModal')) closeModal(); }
    </script>
</body>
</html>
