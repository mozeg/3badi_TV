<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبادي TV - منصة الأفلام والمسلسلات الشاملة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#090d16',
                            800: '#111827',
                            700: '#1f2937'
                        },
                        cyan: {
                            DEFAULT: '#00FFFF',
                            hover: '#00cccc',
                            dark: '#008888',
                            glow: 'rgba(0, 255, 255, 0.4)'
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00FFFF; }
        .glass-header {
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .cyan-glow {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.25);
        }
        .cyan-glow-sm {
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.15);
        }
    </style>
</head>
<body class="min-h-screen selection:bg-cyan selection:text-dark-950 flex flex-col justify-between" 
      x-data="abadiApp()" 
      x-init="init()">

    <!-- Header / Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-header border-b border-gray-800/60 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-reverse space-x-8">
                <a href="#" @click.prevent="switchTab('trending')" class="flex items-center space-x-reverse space-x-3 group">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-cyan-dark to-cyan flex items-center justify-center cyan-glow group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-play text-dark-950 text-xl font-black ml-0.5"></i>
                    </div>
                    <span class="text-2xl font-black tracking-wider text-white">عبادي <span class="text-cyan">TV</span></span>
                </a>

                <!-- Desktop Nav Links -->
                <nav class="hidden md:flex items-center space-x-reverse space-x-6 text-sm font-semibold">
                    <button @click="switchTab('trending')" :class="currentTab === 'trending' ? 'text-cyan font-bold border-b-2 border-cyan pb-1' : 'text-gray-300 hover:text-cyan'" class="transition-colors">الرئيسية</button>
                    <button @click="switchTab('movie')" :class="currentTab === 'movie' ? 'text-cyan font-bold border-b-2 border-cyan pb-1' : 'text-gray-300 hover:text-cyan'" class="transition-colors">الأفلام</button>
                    <button @click="switchTab('tv')" :class="currentTab === 'tv' ? 'text-cyan font-bold border-b-2 border-cyan pb-1' : 'text-gray-300 hover:text-cyan'" class="transition-colors">المسلسلات</button>
                    <button @click="currentTab = 'watchlist'" :class="currentTab === 'watchlist' ? 'text-cyan font-bold border-b-2 border-cyan pb-1' : 'text-gray-300 hover:text-cyan'" class="transition-colors flex items-center gap-1.5">
                        <i class="fa-solid fa-bookmark text-xs"></i> المفضلة
                        <span class="bg-cyan/20 text-cyan px-2 py-0.5 rounded-full text-xs font-bold" x-text="watchlist.length"></span>
                    </button>
                </nav>
            </div>

            <!-- Search & Profile -->
            <div class="flex items-center space-x-reverse space-x-4">
                <div class="relative w-44 sm:w-64">
                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" 
                           x-model="searchQuery" 
                           @input.debounce.500ms="performSearch()"
                           placeholder="ابحث عن فيلم، مسلسل..." 
                           class="w-full bg-dark-800 border border-gray-700/80 rounded-full pr-10 pl-4 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan focus:ring-1 focus:ring-cyan transition-all">
                    <button x-show="searchQuery.length > 0" @click="searchQuery = ''; fetchMedia(currentTab)" class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 hover:text-cyan">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 z-50 bg-dark-900/95 backdrop-blur-lg border-t border-gray-800 md:hidden flex justify-around py-3 px-2">
        <button @click="switchTab('trending')" :class="currentTab === 'trending' ? 'text-cyan' : 'text-gray-400'" class="flex flex-col items-center text-xs font-medium">
            <i class="fa-solid fa-house text-lg mb-1"></i>
            <span>الرئيسية</span>
        </button>
        <button @click="switchTab('movie')" :class="currentTab === 'movie' ? 'text-cyan' : 'text-gray-400'" class="flex flex-col items-center text-xs font-medium">
            <i class="fa-solid fa-film text-lg mb-1"></i>
            <span>الأفلام</span>
        </button>
        <button @click="switchTab('tv')" :class="currentTab === 'tv' ? 'text-cyan' : 'text-gray-400'" class="flex flex-col items-center text-xs font-medium">
            <i class="fa-solid fa-tv text-lg mb-1"></i>
            <span>المسلسلات</span>
        </button>
        <button @click="switchTab('watchlist')" :class="currentTab === 'watchlist' ? 'text-cyan' : 'text-gray-400'" class="flex flex-col items-center text-xs font-medium relative">
            <i class="fa-solid fa-bookmark text-lg mb-1"></i>
            <span>المفضلة</span>
            <span class="absolute top-0 right-3 bg-cyan text-dark-950 w-4 h-4 rounded-full text-[10px] flex items-center justify-center font-bold" x-text="watchlist.length"></span>
        </button>
    </div>

    <!-- Main Section Content -->
    <main class="pt-24 pb-20 md:pb-12 flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Section Header Title -->
            <div class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
                <h1 class="text-xl sm:text-2xl font-black flex items-center gap-3">
                    <span class="w-3 h-8 bg-cyan rounded-full inline-block cyan-glow"></span>
                    <span x-text="sectionTitle"></span>
                </h1>
                <span class="text-xs text-gray-400" x-text="mediaList.length + ' عمل متاح'"></span>
            </div>

            <!-- Loader State -->
            <template x-if="loading">
                <div class="flex justify-center items-center py-32">
                    <div class="w-12 h-12 border-4 border-gray-800 border-t-cyan rounded-full animate-spin"></div>
                </div>
            </template>

            <!-- Media Grid -->
            <template x-if="!loading">
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                    <template x-for="item in mediaList" :key="item.id">
                        <div class="group bg-dark-800 rounded-2xl overflow-hidden border border-gray-800 hover:border-cyan/50 transition-all duration-300 flex flex-col hover:shadow-xl hover:shadow-cyan/10">
                            <!-- Poster Container -->
                            <div class="relative aspect-[2/3] overflow-hidden bg-dark-950 cursor-pointer" @click="openModal(item)">
                                <img :src="item.poster_path ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://placehold.co/400x600/111827/ffffff?text=Abadi+TV'" 
                                     :alt="item.title || item.name" 
                                     class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" 
                                     loading="lazy">
                                
                                <!-- Rating Badge -->
                                <div class="absolute top-2 right-2 bg-dark-900/90 backdrop-blur border border-gray-700/80 text-yellow-400 px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow">
                                    <i class="fa-solid fa-star text-[10px]"></i>
                                    <span x-text="item.vote_average ? item.vote_average.toFixed(1) : 'N/A'"></span>
                                </div>

                                <!-- Type Badge -->
                                <div class="absolute top-2 left-2 bg-cyan text-dark-950 px-2.5 py-0.5 rounded-md text-[10px] font-black shadow">
                                    <span x-text="(item.media_type === 'movie' || item.title) ? 'فيلم' : 'مسلسل'"></span>
                                </div>

                                <!-- Play Hover Overlay -->
                                <div class="absolute inset-0 bg-dark-950/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                    <div class="w-12 h-12 rounded-full bg-cyan text-dark-950 flex items-center justify-center shadow-lg cyan-glow transform scale-75 group-hover:scale-100 transition-transform">
                                        <i class="fa-solid fa-play ml-0.5 text-base"></i>
                                    </div>
                                </div>
                            </div>

                            <!-- Card Info -->
                            <div class="p-3.5 flex flex-col flex-grow justify-between">
                                <div>
                                    <div class="flex items-center justify-between text-xs text-gray-400 mb-1">
                                        <span x-text="(item.release_date || item.first_air_date || '').split('-')[0] || 'غير محدد'"></span>
                                    </div>
                                    <h3 @click="openModal(item)" class="font-bold text-gray-100 text-sm sm:text-base line-clamp-1 hover:text-cyan cursor-pointer transition-colors" x-text="item.title || item.name"></h3>
                                </div>

                                <div class="mt-3 pt-3 border-t border-gray-700/50 flex items-center justify-between">
                                    <span class="text-[11px] text-cyan font-semibold">شاهد الآن</span>
                                    <button @click="toggleWatchlist(item)" :class="isInWatchlist(item.id) ? 'text-cyan' : 'text-gray-400 hover:text-cyan'" class="p-1 transition-colors" title="إضافة للمفضلة">
                                        <i :class="isInWatchlist(item.id) ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'" class="text-base"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Empty State -->
            <template x-if="!loading && mediaList.length === 0">
                <div class="text-center py-24 bg-dark-800/40 rounded-3xl border border-gray-800 mt-6">
                    <div class="w-16 h-16 bg-dark-800 text-cyan rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl cyan-glow-sm">
                        <i class="fa-solid fa-clapperboard"></i>
                    </div>
                    <h3 class="text-lg font-bold text-gray-200 mb-1">عذراً، لا توجد نتائج مطابقة</h3>
                    <p class="text-gray-400 text-xs sm:text-sm">حاول البحث بكلمات أخرى أو تصفح قسم آخر.</p>
                </div>
            </template>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-900 border-t border-gray-800/80 py-6 text-center text-xs text-gray-400">
        <p>جميع الحقوق محفوظة &copy; 2026 <span class="text-cyan font-bold">عبادي TV</span> - منصة البث السينمائي الشاملة</p>
    </footer>

    <!-- Video Player & Details Modal -->
    <div x-show="modalOpen" 
         class="fixed inset-0 z-50 overflow-y-auto bg-dark-950/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         style="display: none;">
        
        <div class="bg-dark-800 border border-gray-700 w-full max-w-4xl rounded-3xl overflow-hidden shadow-2xl relative my-8" @click.away="closeModal()">
            <!-- Close Button -->
            <button @click="closeModal()" class="absolute top-4 left-4 z-20 w-10 h-10 rounded-full bg-dark-900/90 hover:bg-cyan hover:text-dark-950 text-white flex items-center justify-center transition-colors shadow">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <!-- Video Player Iframe Container -->
            <div class="relative aspect-video w-full bg-black">
                <iframe class="w-full h-full" :src="activePlayerUrl" title="Streaming Player" frameborder="0" allowfullscreen></iframe>
            </div>

            <!-- Modal Content & Selectors -->
            <div class="p-6 sm:p-8 space-y-6 max-h-[55vh] overflow-y-auto">
                <!-- Header Info -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-gray-700/80 pb-6">
                    <div>
                        <div class="flex items-center space-x-reverse space-x-3 mb-2">
                            <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 px-2.5 py-0.5 rounded-lg text-xs font-bold flex items-center gap-1">
                                <i class="fa-solid fa-star"></i> <span x-text="activeItem.vote_average ? activeItem.vote_average.toFixed(1) : 'N/A'"></span>
                            </span>
                            <span class="text-gray-400 text-xs" x-text="(activeItem.release_date || activeItem.first_air_date || '').split('-')[0]"></span>
                            <span class="bg-cyan/20 text-cyan border border-cyan/30 px-2.5 py-0.5 rounded-lg text-xs font-bold" x-text="activeItem.media_type === 'tv' || activeItem.name ? 'مسلسل تلفزيوني' : 'فيلم سينمائي'"></span>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-black text-white" x-text="activeItem.title || activeItem.name"></h2>
                    </div>

                    <!-- Watchlist Toggle inside Modal -->
                    <button @click="toggleWatchlist(activeItem)" :class="isInWatchlist(activeItem.id) ? 'bg-cyan text-dark-950 font-black cyan-glow-sm' : 'bg-dark-700 hover:bg-dark-600 text-gray-200 border border-gray-600 font-bold'" class="px-5 py-2.5 rounded-xl flex items-center gap-2 transition-all self-start">
                        <i :class="isInWatchlist(activeItem.id) ? 'fa-solid fa-check' : 'fa-solid fa-bookmark'"></i>
                        <span x-text="isInWatchlist(activeItem.id) ? 'مضاف للمفضلة' : 'إضافة للمفضلة'"></span>
                    </button>
                </div>

                <!-- Series Season & Episode Selectors -->
                <template x-if="activeItem.media_type === 'tv' || activeItem.name">
                    <div class="bg-dark-900/80 p-4 rounded-2xl border border-gray-700/60 space-y-3">
                        <h4 class="text-xs font-bold text-cyan uppercase tracking-wider">اختيار الموسم والحلقة</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Season Dropdown -->
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">الموسم</label>
                                <select x-model="selectedSeason" @change="updatePlayerUrl()" class="w-full bg-dark-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan">
                                    <template x-for="s in 5" :key="s">
                                        <option :value="s" x-text="'الموسم ' + s"></option>
                                    </template>
                                </select>
                            </div>
                            <!-- Episode Dropdown -->
                            <div>
                                <label class="block text-xs text-gray-400 mb-1">الحلقة</label>
                                <select x-model="selectedEpisode" @change="updatePlayerUrl()" class="w-full bg-dark-800 border border-gray-700 text-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan">
                                    <template x-for="ep in 25" :key="ep">
                                        <option :value="ep" x-text="'الحلقة ' + ep"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Overview Description -->
                <div>
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">القصة والنبذة</h4>
                    <p class="text-gray-300 text-sm sm:text-base leading-relaxed" x-text="activeItem.overview || 'لا توجد قصة متوفرة لهذا العمل حالياً.'"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const TMDB_API_KEY = 'c8192660aa8a221f736024987ec96af5';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';

        function abadiApp() {
            return {
                currentTab: 'trending', // 'trending', 'movie', 'tv', 'watchlist'
                sectionTitle: 'العروض الرائجة عالمياً',
                mediaList: [],
                loading: true,
                searchQuery: '',
                modalOpen: false,
                activeItem: {},
                activePlayerUrl: '',
                selectedSeason: 1,
                selectedEpisode: 1,
                watchlist: [],

                init() {
                    // Load watchlist from localStorage
                    const saved = localStorage.getItem('abadi_tv_watchlist');
                    if (saved) {
                        try { this.watchlist = JSON.parse(saved); } catch(e) { this.watchlist = []; }
                    }
                    this.fetchMedia('trending');
                },

                switchTab(tab) {
                    this.currentTab = tab;
                    this.searchQuery = '';
                    if (tab === 'trending') {
                        this.sectionTitle = 'العروض الرائجة عالمياً';
                        this.fetchMedia('trending');
                    } else if (tab === 'movie') {
                        this.sectionTitle = 'أحدث الأفلام السينمائية';
                        this.fetchMedia('movie');
                    } else if (tab === 'tv') {
                        this.sectionTitle = 'أحدث المسلسلات التلفزيونية';
                        this.fetchMedia('tv');
                    } else if (tab === 'watchlist') {
                        this.sectionTitle = 'قائمة المفضلة الخاصة بك';
                        this.mediaList = this.watchlist;
                        this.loading = false;
                    }
                },

                async fetchMedia(type) {
                    this.loading = true;
                    let url = '';
                    if (type === 'trending') {
                        url = `${TMDB_BASE_URL}/trending/all/day?api_key=${TMDB_API_KEY}&language=ar-AR`;
                    } else if (type === 'movie') {
                        url = `${TMDB_BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&language=ar-AR&sort_by=popularity.desc`;
                    } else if (type === 'tv') {
                        url = `${TMDB_BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&language=ar-AR&sort_by=popularity.desc`;
                    }

                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        this.mediaList = data.results || [];
                    } catch (err) {
                        console.error("Error fetching TMDb data:", err);
                        this.mediaList = [];
                    } finally {
                        this.loading = false;
                    }
                },

                async performSearch() {
                    if (!this.searchQuery.trim()) {
                        this.fetchMedia(this.currentTab);
                        return;
                    }
                    this.loading = true;
                    this.sectionTitle = `نتائج البحث عن: "${this.searchQuery}"`;
                    try {
                        const res = await fetch(`${TMDB_BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&language=ar-AR&query=${encodeURIComponent(this.searchQuery)}`);
                        const data = await res.json();
                        this.mediaList = (data.results || []).filter(item => item.poster_path);
                    } catch (err) {
                        console.error("Search error:", err);
                    } finally {
                        this.loading = false;
                    }
                },

                openModal(item) {
                    this.activeItem = item;
                    this.selectedSeason = 1;
                    this.selectedEpisode = 1;
                    this.updatePlayerUrl();
                    this.modalOpen = true;
                    document.body.style.overflow = 'hidden';
                },

                updatePlayerUrl() {
                    const isTv = this.activeItem.media_type === 'tv' || this.activeItem.name;
                    if (isTv) {
                        this.activePlayerUrl = `https://vidsrc.me/embed/tv?tmdb=${this.activeItem.id}&season=${this.selectedSeason}&episode=${this.selectedEpisode}`;
                    } else {
                        this.activePlayerUrl = `https://vidsrc.me/embed/movie?tmdb=${this.activeItem.id}`;
                    }
                },

                closeModal() {
                    this.modalOpen = false;
                    this.activePlayerUrl = '';
                    document.body.style.overflow = 'auto';
                },

                toggleWatchlist(item) {
                    const idx = this.watchlist.findIndex(i => i.id === item.id);
                    if (idx > -1) {
                        this.watchlist.splice(idx, 1);
                    } else {
                        this.watchlist.push(item);
                    }
                    localStorage.setItem('abadi_tv_watchlist', JSON.stringify(this.watchlist));
                    if (this.currentTab === 'watchlist') {
                        this.mediaList = this.watchlist;
                    }
                },

                isInWatchlist(id) {
                    return this.watchlist.some(i => i.id === id);
                }
            }
        }
    </script>
</body>
</html>
